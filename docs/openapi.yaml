openapi: 3.1.0
info:
  title: EcomGen API
  version: 0.1.0
  description: Backend-first contract for the EcomGen desktop-first local application.
security: []
servers:
  - url: http://localhost:8787/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ecom-templates:
    get:
      operationId: listEcomDetailsImageTemplates
      responses:
        '200':
          description: Structured templates adapted from the pinned ecom-details-image upstream Skill.
          content:
            application/json:
              schema:
                type: object
                required: [source, items]
                properties:
                  source:
                    type: object
                    required: [repository, commit, sourcePath]
                    properties:
                      repository: { type: string, format: uri }
                      commit: { type: string }
                      sourcePath: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, upstreamNumber, name, keywords, trigger_phrases, prompt_template, defaults, variants, category_tips, defaultSize]
                      properties:
                        id: { type: string, example: hero-image }
                        upstreamNumber: { type: integer, minimum: 1, maximum: 25 }
                        name: { type: string }
                        keywords: { type: array, items: { type: string } }
                        trigger_phrases: { type: array, items: { type: string } }
                        prompt_template: { type: object, additionalProperties: { type: string } }
                        defaults: { type: object, additionalProperties: { type: string } }
                        variants: { type: object, additionalProperties: { type: object } }
                        category_tips: { type: object, additionalProperties: { type: string } }
                        defaultSize: { type: string, enum: [1024x1024, 1024x1536] }
  /providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: Provider configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
    post:
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderInput'
      responses:
        '201':
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '400': { $ref: '#/components/responses/ValidationError' }
  /providers/{providerId}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    patch:
      operationId: updateProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderInput'
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProvider
      responses:
        '204': { description: Provider deleted. }
        '409': { $ref: '#/components/responses/Conflict' }
  /providers/{providerId}/test:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    post:
      operationId: testProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId: { type: string }
                kind: { type: string, enum: [reasoning, image], default: image }
      responses:
        '200':
          description: Provider connectivity result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, providerId, modelId, kind, latencyMs]
                properties:
                  ok: { type: boolean }
                  providerId: { type: string, format: uuid }
                  modelId: { type: string }
                  kind: { type: string, enum: [reasoning, image] }
                  latencyMs: { type: integer, minimum: 0 }
                  modelAvailable: { type: [boolean, 'null'] }
        '502': { $ref: '#/components/responses/ProviderError' }
  /projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      responses:
        '200':
          description: Project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInput'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      operationId: deleteProject
      responses:
        '204': { description: Project deleted. }
  /projects/{projectId}/variants:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listVariants
      responses:
        '200':
          description: Variants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantList'
    post:
      operationId: createVariant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariantInput'
      responses:
        '201':
          description: Variant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variant'
  /projects/{projectId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAssets
      responses:
        '200':
          description: Assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
    post:
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, role]
              properties:
                file: { type: string, format: binary }
                role: { $ref: '#/components/schemas/AssetRole' }
                variantId: { type: [string, 'null'], format: uuid }
      responses:
        '201':
          description: Asset uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
  /assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    patch:
      operationId: updateAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/AssetRole' }
                variantId: { type: [string, 'null'], format: uuid }
      responses:
        '200':
          description: Asset updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
    delete:
      operationId: deleteAsset
      responses:
        '204': { description: Asset deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/planning-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createPlanningJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanningJobInput'
      responses:
        '202':
          description: Planning job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422': { $ref: '#/components/responses/CapabilityUnsupported' }
  /projects/{projectId}/storyboard:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getStoryboard
      responses:
        '200':
          description: Current storyboard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storyboard'
  /projects/{projectId}/storyboard/confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: confirmStoryboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Storyboard frozen for generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storyboard'
        '409': { $ref: '#/components/responses/Conflict' }
  /storyboard-items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/StoryboardItemId'
    patch:
      operationId: updateStoryboardItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryboardItemInput'
      responses:
        '200':
          description: Storyboard item updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardItem'
  /projects/{projectId}/generation-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createGenerationJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storyboardItemIds]
              properties:
                storyboardItemIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                revision: { type: string, maxLength: 2000 }
      responses:
        '202':
          description: Generation job queued.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Conflict' }
  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      responses:
        '200':
          description: Job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{jobId}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: retryJob
      responses:
        '202':
          description: New retry job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /outputs/{outputId}/review:
    parameters:
      - $ref: '#/components/parameters/OutputId'
    patch:
      operationId: reviewOutput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [SELECTED, REJECTED, NEEDS_REVIEW] }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Output review updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Output'
  /projects/{projectId}/export-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createExportJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportJobInput'
      responses:
        '202':
          description: Export job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: getExport
      responses:
        '200':
          description: Export package state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
  /files/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: downloadAsset
      responses:
        '200': { description: Original asset bytes. }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/outputs/{outputId}:
    parameters:
      - $ref: '#/components/parameters/OutputId'
    get:
      operationId: downloadOutput
      responses:
        '200': { description: Generated image bytes. }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: downloadExport
      responses:
        '200': { description: ZIP package bytes. }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      operationId: subscribeEvents
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
components:
  parameters:
    ProviderId: { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    StoryboardItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    OutputId: { name: outputId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
  responses:
    ValidationError:
      description: Request does not match the schema.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Current resource state rejects this operation.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CapabilityUnsupported:
      description: The selected model lacks a requested capability.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ProviderError:
      description: Provider connectivity or protocol failure.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    Health: { type: object, required: [status], properties: { status: { type: string, const: ok } } }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
            requestId: { type: string, format: uuid }
    ProviderConfig:
      type: object
      required: [id, name, baseUrl, reasoningProtocol, models, hasApiKey, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseUrl: { type: string, format: uri }
        reasoningProtocol: { type: string, enum: [openai, dashscope_qwen] }
        hasApiKey: { type: boolean }
        models: { type: array, items: { $ref: '#/components/schemas/ModelCapability' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModelCapability:
      type: object
      required: [id, supportsVision, supportsThinking, supportsTools, supportsStructuredOutput]
      properties:
        id: { type: string }
        supportsVision: { type: boolean }
        supportsThinking: { type: boolean }
        supportsTools: { type: boolean }
        supportsStructuredOutput: { type: boolean }
        imageApiKind: { type: [string, 'null'], enum: [openai_images, custom, null] }
    CreateProviderInput:
      type: object
      required: [name, baseUrl, reasoningProtocol, apiKey, models]
      properties:
        name: { type: string, minLength: 1 }
        baseUrl: { type: string, format: uri }
        reasoningProtocol: { type: string, enum: [openai, dashscope_qwen] }
        apiKey: { type: string, minLength: 1, writeOnly: true }
        models: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ModelCapability' } }
    UpdateProviderInput:
      allOf:
        - $ref: '#/components/schemas/CreateProviderInput'
    ProviderList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProviderConfig' } }
        nextCursor: { type: [string, 'null'] }
    Project:
      type: object
      required: [id, name, platformTargets, reasoningProviderId, reasoningModelId, imageProviderId, imageModelId, defaultMode, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: [string, 'null'] }
        productDescription: { type: [string, 'null'] }
        verifiedFacts: { type: array, items: { type: string } }
        prohibitedClaims: { type: array, items: { type: string } }
        brandGuidelines: { type: object, additionalProperties: { type: string } }
        platformTargets: { type: array, minItems: 1, items: { type: string, enum: [DOMESTIC, AMAZON] } }
        reasoningProviderId: { type: string, format: uuid }
        reasoningModelId: { type: string }
        imageProviderId: { type: string, format: uuid }
        imageModelId: { type: string }
        defaultMode: { type: string, enum: [CREATIVE, PIXEL_PROTECTED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModelRef:
      type: object
      required: [providerId, modelId]
      properties:
        providerId: { type: string, format: uuid }
        modelId: { type: string }
    CreateProjectInput:
      type: object
      required: [name, platformTargets, reasoningProviderId, reasoningModelId, imageProviderId, imageModelId, defaultMode]
      properties:
        name: { type: string, minLength: 1 }
        category: { type: [string, 'null'] }
        productDescription: { type: [string, 'null'] }
        verifiedFacts: { type: array, items: { type: string } }
        prohibitedClaims: { type: array, items: { type: string } }
        brandGuidelines: { type: object, additionalProperties: { type: string } }
        platformTargets: { type: array, minItems: 1, items: { type: string, enum: [DOMESTIC, AMAZON] } }
        reasoningProviderId: { type: string, format: uuid }
        reasoningModelId: { type: string }
        imageProviderId: { type: string, format: uuid }
        imageModelId: { type: string }
        defaultMode: { type: string, enum: [CREATIVE, PIXEL_PROTECTED] }
    UpdateProjectInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: [string, 'null'] }
        productDescription: { type: [string, 'null'] }
        verifiedFacts: { type: array, items: { type: string } }
        prohibitedClaims: { type: array, items: { type: string } }
        brandGuidelines: { type: object, additionalProperties: { type: string } }
        platformTargets: { type: array, minItems: 1, items: { type: string, enum: [DOMESTIC, AMAZON] } }
        reasoningModel: { $ref: '#/components/schemas/ModelRef' }
        imageModel: { $ref: '#/components/schemas/ModelRef' }
        defaultMode: { type: string, enum: [CREATIVE, PIXEL_PROTECTED] }
    ProjectList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Project' } }
        nextCursor: { type: [string, 'null'] }
    Variant:
      type: object
      required: [id, projectId, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        name: { type: string }
        attributes: { type: object, additionalProperties: { type: string } }
        createdAt: { type: string, format: date-time }
    CreateVariantInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        attributes: { type: object, additionalProperties: { type: string } }
    VariantList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        nextCursor: { type: [string, 'null'] }
    AssetRole: { type: string, enum: [PRODUCT_TRUTH, PACKAGING, STYLE_REFERENCE, LAYOUT_REFERENCE] }
    Asset:
      type: object
      required: [id, projectId, role, url, mimeType, createdAt]
      properties:
        id: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        variantId: { type: [string, 'null'], format: uuid }
        role: { $ref: '#/components/schemas/AssetRole' }
        url: { type: string }
        mimeType: { type: string }
        width: { type: [integer, 'null'] }
        height: { type: [integer, 'null'] }
        createdAt: { type: string, format: date-time }
    AssetList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Asset' } }
        nextCursor: { type: [string, 'null'] }
    CreatePlanningJobInput:
      type: object
      required: [imageTypes]
      properties:
        imageTypes: { type: array, minItems: 1, items: { type: string } }
        allowAgentRecommendations: { type: boolean, default: false }
        userInstruction: { type: string, maxLength: 4000 }
    Storyboard:
      type: object
      required: [projectId, version, status, campaignStyleLock, items]
      properties:
        projectId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [DRAFT, CONFIRMED] }
        campaignStyleLock: { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/StoryboardItem' } }
    StoryboardItem:
      type: object
      required: [id, assetType, variantScope, mode, status, promptInstruction, riskFlags]
      properties:
        id: { type: string, format: uuid }
        assetType: { type: string }
        variantScope: { type: string, description: COMMON or a Variant UUID }
        mode: { type: string, enum: [CREATIVE, PIXEL_PROTECTED] }
        status: { type: string, enum: [DRAFT, CONFIRMED, GENERATING, GENERATED] }
        promptInstruction: { type: string }
        factClaims: { type: array, items: { type: object } }
        riskFlags: { type: array, items: { type: string } }
    UpdateStoryboardItemInput:
      type: object
      properties:
        assetType: { type: string }
        variantScope: { type: string }
        mode: { type: string, enum: [CREATIVE, PIXEL_PROTECTED] }
        promptInstruction: { type: string, maxLength: 4000 }
    Job:
      type: object
      required: [id, type, status, progress, retryable, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [PLAN, GENERATE, EXPORT] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED] }
        progress: { type: integer, minimum: 0, maximum: 100 }
        retryable: { type: boolean }
        requestFingerprint: { type: [string, 'null'] }
        providerId: { type: [string, 'null'], format: uuid }
        modelId: { type: [string, 'null'] }
        estimatedCost: { type: [object, 'null'] }
        actualCost: { type: [object, 'null'] }
        cancelRequested: { type: boolean }
        error: { type: [object, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Output:
      type: object
      required: [id, storyboardItemId, url, reviewDecision, createdAt]
      properties:
        id: { type: string, format: uuid }
        storyboardItemId: { type: string, format: uuid }
        url: { type: string }
        reviewDecision: { type: string, enum: [SELECTED, REJECTED, NEEDS_REVIEW] }
        createdAt: { type: string, format: date-time }
    CreateExportJobInput:
      type: object
      required: [outputIds, platformTargets]
      properties:
        outputIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        platformTargets: { type: array, minItems: 1, items: { type: string, enum: [DOMESTIC, AMAZON] } }
        includeDetailPageSlices: { type: boolean, default: false }
    Export:
      type: object
      required: [id, projectId, status, createdAt]
