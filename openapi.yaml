      responses:
        "200":
          description: Print pack artifact by file index (print-ready PNG or manifest JSON).
          content:
            image/png:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /patterns/upload:
    post:
      operationId: uploadPattern
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 花型图稿（建议透明底 PNG）。
                name:
                  type: string
                tags:
                  type: string
                  description: JSON 数组字符串形式的标签列表。
                pipeline:
                  type: string
                  description: 可选的成包答案（PatternPipelineAnswers 的 JSON 字符串）；带上时上传完成后立即起跑成包流水线。
      responses:
        "201":
          description: Pattern stored directly into the library (source UPLOADED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pattern"
        "400":
          $ref: "#/components/responses/ValidationError"
  /pattern-drafts:
    get:
      operationId: listPatternDrafts
      parameters:
        - name: archived
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Pattern drafts (active by default; archived only when ?archived is present).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternDraftList"
    post:
      operationId: createPatternDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatternDraftInput"
      responses:
        "201":
          description: Draft created with default conditions and auto name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternDraft"
        "400":
          $ref: "#/components/responses/ValidationError"
  /pattern-drafts/{draftId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: getPatternDraft
      responses:
        "200":
          description: Draft with conditions, revision and view selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternDraft"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updatePatternDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatternDraftInput"
      responses:
        "200":
          description: Autosaved draft; revision incremented.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatternDraft"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      operationId: deletePatternDraft
      responses:
        "204":
          description: Draft records and draft-owned files removed; formal patterns untouched.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /pattern-drafts/{draftId}/media:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: listDraftMedia
      responses:
        "200":
          description: Reference and mask media owned by the draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftMediaList"
    post:
      operationId: createDraftMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - role
              properties:
                file:
                  type: string
                  format: binary
                role:
                  type: string
                  enum:
                    - REFERENCE
                    - MASK
                source:
                  type: string
                  enum:
                    - UPLOAD
                    - PATTERN
                patternId:
                  type: string
                  format: uuid
                notes:
                  type: string
      responses:
        "201":
          description: Immutable media snapshot stored under the draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftMedia"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
  /pattern-drafts/{draftId}/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftMediaId"
    patch:
      operationId: updateDraftMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        "200":
          description: Updated reference notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftMedia"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteDraftMedia
      responses:
        "204":
          description: Media removed; files referenced by a submitted batch are retained.
        "404":
          $ref: "#/components/responses/NotFound"
  /pattern-drafts/{draftId}/candidates/{candidateId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftCandidateId"
    delete:
      operationId: deleteDraftCandidate
      responses:
        "204":
          description: Candidate removed; the formal pattern it was finalized into is unaffected.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /pattern-drafts/{draftId}/batches:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: listDraftBatches
      responses:
        "200":
          description: Batch history with slots, partial success and cost when known.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftBatchList"
    post:
      operationId: createDraftBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftBatchInput"
      responses:
        "202":
          description: Batch accepted; one job per batch targeting stable slot indices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDraftBatchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/CapabilityUnsupported"
  /pattern-drafts/{draftId}/batches/{batchId}/retry-failed:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftBatchId"
    post:
      operationId: retryFailedDraftBatch
      responses:
        "202":
          description: Failed slots requeued; successful candidates untouched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryDraftBatchResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /pattern-drafts/{draftId}/candidates:
    parameters:
      - $ref: "#/components/parameters/DraftId"
    get:
      operationId: listDraftCandidates
      responses:
        "200":
          description: Candidates with lineage, transform and tile evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftCandidateList"
  /pattern-drafts/{draftId}/candidates/{candidateId}/edits:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftCandidateId"
    post:
      operationId: createDraftCandidateEdit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDraftBatchInput"
      responses:
        "202":
          description: Edit batch accepted; produces a new candidate linked to its parent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateDraftBatchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/CapabilityUnsupported"
  /pattern-drafts/{draftId}/candidates/{candidateId}/tile-check:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftCandidateId"
    post:
      operationId: checkDraftCandidateTileability
      responses:
        "202":
          description: Deterministic tile check job; verdict and per-axis evidence are written to the candidate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftJobRef"
        "404":
          $ref: "#/components/responses/NotFound"
  /pattern-drafts/{draftId}/candidates/{candidateId}/finalize:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftCandidateId"
    post:
      operationId: finalizeDraftCandidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinalizeDraftCandidateInput"
      responses:
        "200":
          description: This candidate was already finalized; the existing pattern is returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeDraftCandidateResponse"
        "201":
          description: Selected candidate copied into the formal pattern library; no production pipeline started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinalizeDraftCandidateResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /files/pattern-drafts/{draftId}/candidates/{candidateId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftCandidateId"
    get:
      operationId: downloadDraftCandidateFile
      responses:
        "200":
          description: Native candidate PNG at its stored resolution and alpha.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /files/pattern-drafts/{draftId}/media/{mediaId}:
    parameters:
      - $ref: "#/components/parameters/DraftId"
      - $ref: "#/components/parameters/DraftMediaId"
    get:
      operationId: downloadDraftMediaFile
      responses:
        "200":
          description: Stored reference or mask image.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StoryboardItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OutputId:
      name: outputId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LayerExportId:
      name: layerExportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserTemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        pattern: ^custom-[0-9a-f]{8}$
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelPortraitId:
      name: portraitId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatternId:
      name: patternId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PrintPackId:
      name: printPackId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PipelineId:
      name: pipelineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PipelineStep:
      name: step
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/PatternPipelineStepName"
    SuiteId:
      name: suiteId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9][a-z0-9._-]{0,127}$
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftBatchId:
      name: batchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftMediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DraftCandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
  responses:
    ValidationError:
      description: Request does not match the schema.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Current resource state rejects this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CapabilityUnsupported:
      description: The selected model lacks a requested capability.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProviderError:
      description: Provider connectivity or protocol failure.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    PlatformTarget:
      type: string
      enum:
        - TAOBAO
        - JD
        - PDD
        - DOUYIN
        - AMAZON
        - SHOPIFY
    TargetMarket:
      type: string
      enum:
        - CHINA_MAINLAND
        - HONG_KONG
        - MACAU
        - TAIWAN
        - UNITED_STATES
        - UNITED_KINGDOM
        - GERMANY
        - FRANCE
        - ITALY
        - SPAIN
        - JAPAN
        - SOUTH_KOREA
    StoryboardMode:
      type: string
      enum:
        - CREATIVE
        - PIXEL_PROTECTED
    StoryboardShotRole:
      type: string
      enum:
        - HERO
        - PAIN_POINT
        - COMPARISON
        - SCENE
        - DETAIL
        - TRUST
        - VARIANT
        - CTA
    AssetRole:
      type: string
      enum:
        - PRODUCT_TRUTH
        - PACKAGING
        - STYLE_REFERENCE
        - LAYOUT_REFERENCE
    UserAssetKind:
      type: string
      enum:
        - PRODUCT
        - REFERENCE
    LibraryItemSource:
      type: string
      enum:
        - UPLOADED
        - GENERATED
        - MODEL
    LibraryItemKind:
      type: string
      enum:
        - PRODUCT
        - REFERENCE
        - GENERATED
        - LAYER
        - MODEL
        - PATTERN
        - PRINT_PACK
    ImageResolution:
      type: string
      enum:
        - 1K
        - 2K
        - 4K
    ImageAspectRatio:
      type: string
      enum:
        - AUTO
        - 1:1
        - 2:3
        - 3:2
        - 3:4
        - 4:3
        - 4:5
        - 5:4
        - 9:16
        - 16:9
        - 21:9
    PlanningMode:
      type: string
      enum:
        - AI
        - MANUAL
    CopywritingTarget:
      type: string
      enum:
        - PRODUCT_DESCRIPTION
        - PLANNING_INSTRUCTION
        - LISTING
    JobType:
      type: string
      enum:
        - PLAN
        - COPYWRITE
        - GENERATE
        - EXPORT
        - EDIT_PLAN
        - EDIT_GENERATE
        - LAYER_PLAN
        - LAYER_EXPORT
        - SUITE_FORGE
        - MODEL_CAST
        - PATTERN_EXTRACT
        - PATTERN_FORGE
        - PATTERN_DERIVE
        - PATTERN_VARIANT
        - PATTERN_TILE_CHECK
        - PRINT_PACK
        - PATTERN_DRAFT_GENERATE
        - PATTERN_DRAFT_EDIT
        - PATTERN_DRAFT_CUTOUT
        - PATTERN_DRAFT_PROCESS
    JobStatus:
      type: string
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - CANCELLED
    ReasoningProtocolProfile:
      type: string
      enum:
        - openai
        - dashscope_qwen
        - openai_responses
    SearchSourceKind:
      type: string
      enum:
        - brave
        - tavily
        - searxng
    EcomSuiteOrigin:
      type: string
      enum:
        - builtin
        - user
    EditOperation:
      type: string
      enum:
        - PRECISE_INPAINT
        - PRODUCT_REPLACE
        - SCENE_ADJUST
        - OUTPAINT
        - NATURAL_FUSION
    EditExecutionMode:
      type: string
      enum:
        - MODEL_DIRECTED
        - MASKED
        - OUTPAINT
        - NEED_INPUT
    CompositePolicy:
      type: string
      enum:
        - MASK_LOCKED
        - NATURAL_BLEND
        - OUTPAINT
        - PROVIDER_RESULT
    ReferenceSource:
      type: string
      enum:
        - PROJECT
        - TEMPORARY
    ReferencePurpose:
      type: string
      enum:
        - PRODUCT_APPEARANCE
        - PACKAGING
        - LABEL
        - STYLE
        - LAYOUT
    EditTurnStatus:
      type: string
      enum:
        - DRAFT
        - PLANNING
        - PLAN_READY
        - NEED_INPUT
        - AWAITING_CONFIRMATION
        - GENERATING
        - SUCCEEDED
        - FAILED
        - CANCELLED
    EditSessionStatus:
      type: string
      enum:
        - ACTIVE
        - ARCHIVED
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - NOT_FOUND
        - CONFLICT
        - CAPABILITY_UNSUPPORTED
        - PROVIDER_NOT_CONFIGURED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - PROVIDER_ERROR
        - QUEUE_UNAVAILABLE
    EventEnvelope:
      type: object
      required:
        - id
        - type
        - projectId
        - occurredAt
        - data
      properties:
        id:
          format: uuid
          type: string
        type:
          type: string
          enum:
            - job.updated
            - storyboard.updated
            - output.created
            - edit-session.updated
            - edit-turn.updated
            - export.updated
            - provider.updated
            - layer-plan.updated
            - layer-export.updated
        projectId:
          format: uuid
          type: string
        occurredAt:
          format: date-time
          type: string
        data: {}
    ModelCapabilities:
      type: object
      required:
        - supportsVision
        - supportsThinking
        - supportsTools
        - supportsStructuredOutput
        - imageApiKind
      properties:
        supportsVision:
          type: boolean
        supportsThinking:
          type: boolean
        supportsTools:
          type: boolean
        supportsStructuredOutput:
          type: boolean
        imageApiKind:
          anyOf:
            - const: openai_images
              type: string
            - const: gemini
              type: string
            - const: custom
              type: string
            - type: "null"
        segmentationProtocol:
          description: Segmentation API protocol declared for this model; mutually exclusive with imageApiKind.
          type: string
          enum:
            - fal
            - grounded_sam
            - seedream_layerize
            - gitee_sam3
    ModelDefinition:
      type: object
      allOf:
        - type: object
          required:
            - id
          properties:
            id:
              minLength: 1
              type: string
        - type: object
          required:
            - supportsVision
            - supportsThinking
            - supportsTools
            - supportsStructuredOutput
            - imageApiKind
          properties:
            supportsVision:
              type: boolean
            supportsThinking:
              type: boolean
            supportsTools:
              type: boolean
            supportsStructuredOutput:
              type: boolean
            imageApiKind:
              anyOf:
                - const: openai_images
                  type: string
                - const: gemini
                  type: string
                - const: custom
                  type: string
                - type: "null"
            segmentationProtocol:
              description: Segmentation API protocol declared for this model; mutually exclusive with imageApiKind.
              type: string
              enum:
                - fal
                - grounded_sam
                - seedream_layerize
                - gitee_sam3
    Asset:
      type: object
      required:
        - id
        - projectId
        - role
        - mimeType
        - createdAt
      properties:
        id:
          format: uuid
          type: string
        projectId:
          format: uuid
          type: string
        role:
          $ref: "#/components/schemas/AssetRole"
        kind:
          $ref: "#/components/schemas/UserAssetKind"
        url:
          type: string
        storagePath:
          type: string
        mimeType:
          type: string
        originalName:
          type: string
        hash:
          type: string
        width:
          anyOf:
            - type: integer
            - type: "null"
        height:
          anyOf:
            - type: integer
            - type: "null"
        createdAt:
          format: date-time
          type: string
    AssetList:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Asset"
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
    CopywritingResult:
      type: object
      required:
        - jobId
        - projectId
        - target
        - content
        - createdAt
      properties:
        jobId:
          format: uuid
          type: string
        projectId:
          format: uuid
          type: string
        target:
          $ref: "#/components/schemas/CopywritingTarget"
        content:
          type: string
        createdAt:
          format: date-time
          type: string
    CreateCopywritingJobInput:
      type: object
      required:
        - target
        - regenerationKey
      properties:
        target:
          $ref: "#/components/schemas/CopywritingTarget"
        regenerationKey:
          description: Unique key for an intentional copywriting run.
          minLength: 1
          type: string
    CreateExportJobInput:
      type: object
      properties:
        outputIds:
          type: array
          items:
            format: uuid
            type: string
        filenamePrefix:
          type: string
        platformTargets:
          type: array
          items:
            type: string
            enum:
              - TAOBAO
              - JD
              - PDD
              - DOUYIN
              - AMAZON
              - SHOPIFY
        includeDetailPageSlices:
          default: false
          type: boolean
    CreatePlanningJobInput:
      type: object
      properties:
        planningMode:
          $ref: "#/components/schemas/PlanningMode"
        requestedTypes:
          type: array
          items:
            type: string
        requestedSuiteShots:
          maxItems: 12
          description: 套图分镜 assetType 列表（<suiteId>::<shotId>，仅手动规划使用）；每个分镜生成一条分镜，可与 requestedTypes 混选。
          type: array
          items:
            minLength: 1
            type: string
        imageTypes:
          type: array
          items:
            type: string
        userInstruction:
          maxLength: 4000
          type: string
        candidatesPerType:
          minimum: 1
          maximum: 4
          type: integer
        targetImageCount:
          minimum: 1
          maximum: 12
          type: integer
        imageResolution:
          $ref: "#/components/schemas/ImageResolution"
        imageAspectRatio:
          $ref: "#/components/schemas/ImageAspectRatio"
        regenerationKey:
          description: Unique key for an intentional re-planning run.
          minLength: 1
          type: string
    CreateProjectInput:
      type: object
      required:
        - name
        - reasoningProviderId
        - reasoningModelId
        - imageProviderId
        - imageModelId
        - defaultMode
