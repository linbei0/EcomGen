openapi: 3.1.0
info:
  title: EcomGen API
  version: 0.1.0
  description: Backend-first contract for the EcomGen desktop-first local application.
security: []
servers:
  - url: http://localhost:8787/api/v1
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ecom-templates:
    get:
      operationId: listEcomDetailsImageTemplates
      responses:
        '200':
          description: Structured templates adapted from the pinned ecom-details-image upstream Skill.
          content:
            application/json:
              schema:
                type: object
                required: [source, items]
                properties:
                  source:
                    type: object
                    required: [repository, commit, sourcePath]
                    properties:
                      repository: { type: string, format: uri }
                      commit: { type: string }
                      sourcePath: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, upstreamNumber, name, keywords, trigger_phrases, prompt_template, defaults, variants, category_tips, defaultSize]
                      properties:
                        id: { type: string, example: hero-image }
                        upstreamNumber: { type: integer, minimum: 1, maximum: 25 }
                        name: { type: string }
                        keywords: { type: array, items: { type: string } }
                        trigger_phrases: { type: array, items: { type: string } }
                        prompt_template: { type: object, additionalProperties: { type: string } }
                        defaults: { type: object, additionalProperties: { type: string } }
                        variants: { type: object, additionalProperties: { type: object } }
                        category_tips: { type: object, additionalProperties: { type: string } }
                        defaultSize: { type: string, enum: [1024x1024, 1024x1536] }
  /providers:
    get:
      operationId: listProviders
      responses:
        '200':
          description: Provider configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderList'
    post:
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderInput'
      responses:
        '201':
          description: Provider created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '400': { $ref: '#/components/responses/ValidationError' }
  /providers/{providerId}:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    patch:
      operationId: updateProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProviderInput'
      responses:
        '200':
          description: Provider updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderConfig'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteProvider
      responses:
        '204': { description: Provider deleted. }
        '409': { $ref: '#/components/responses/Conflict' }
  /providers/{providerId}/test:
    parameters:
      - $ref: '#/components/parameters/ProviderId'
    post:
      operationId: testProviderConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelId]
              properties:
                modelId: { type: string }
                kind: { type: string, enum: [reasoning, image], default: image }
      responses:
        '200':
          description: Provider connectivity result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, providerId, modelId, kind, latencyMs]
                properties:
                  ok: { type: boolean }
                  providerId: { type: string, format: uuid }
                  modelId: { type: string }
                  kind: { type: string, enum: [reasoning, image] }
                  latencyMs: { type: integer, minimum: 0 }
                  modelAvailable: { type: [boolean, 'null'] }
        '502': { $ref: '#/components/responses/ProviderError' }
  /search-sources:
    get:
      operationId: listSearchSources
      responses:
        '200':
          description: Search source configurations in execution priority order.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSourceList' }
    post:
      operationId: createSearchSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSearchSourceInput' }
      responses:
        '201':
          description: Search source created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSourceConfig' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /search-sources/{sourceId}:
    parameters:
      - name: sourceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateSearchSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSearchSourceInput' }
      responses:
        '200':
          description: Search source updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchSourceConfig' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteSearchSource
      responses:
        '204': { description: Search source deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects:
    get:
      operationId: listProjects
      parameters:
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectInput'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      responses:
        '200':
          description: Project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectInput'
      responses:
        '200':
          description: Project updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    delete:
      operationId: deleteProject
      responses:
        '204': { description: Project deleted. }
  /projects/{projectId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listAssets
      responses:
        '200':
          description: Assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetList'
    post:
      operationId: uploadAsset
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                role: { $ref: '#/components/schemas/AssetRole' }
                kind: { $ref: '#/components/schemas/UserAssetKind' }
      responses:
        '200':
          description: Asset uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
  /assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    patch:
      operationId: updateAsset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                 role: { $ref: '#/components/schemas/AssetRole' }
                 kind: { $ref: '#/components/schemas/UserAssetKind' }
      responses:
        '200':
          description: Asset updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
    delete:
      operationId: deleteAsset
      responses:
        '204': { description: Asset deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /projects/{projectId}/planning-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createPlanningJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlanningJobInput'
      responses:
        '202':
          description: Planning job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '422': { $ref: '#/components/responses/CapabilityUnsupported' }
  /projects/{projectId}/copywriting-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createCopywritingJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCopywritingJobInput'
      responses:
        '200':
          description: Existing copywriting job reused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '202':
          description: Copywriting job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/CapabilityUnsupported' }
  /copywriting-jobs/{jobId}/result:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getCopywritingResult
      responses:
        '200':
          description: Generated copywriting result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopywritingResult'
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/storyboard:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getStoryboard
      responses:
        '200':
          description: Current storyboard.
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/StoryboardBundle'
  /projects/{projectId}/storyboard/confirm:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: confirmStoryboard
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Storyboard frozen for generation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Storyboard'
        '409': { $ref: '#/components/responses/Conflict' }
  /storyboard-items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/StoryboardItemId'
    patch:
      operationId: updateStoryboardItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoryboardItemInput'
      responses:
        '200':
          description: Storyboard item updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoryboardItem'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: deleteStoryboardItem
      responses:
        '204':
          description: Draft storyboard item deleted.
        '409':
          $ref: '#/components/responses/Conflict'
  /projects/{projectId}/generation-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createGenerationJobs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storyboardItemIds]
              properties:
                storyboardItemIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
                revision: { type: string, maxLength: 2000 }
                generationConfig:
                  type: object
                  properties:
                    imageResolution: { $ref: '#/components/schemas/ImageResolution' }
                    imageAspectRatio: { $ref: '#/components/schemas/ImageAspectRatio' }
                    candidateCount: { type: integer, minimum: 1, maximum: 4 }
                    imageModel:
                      type: object
                      required: [providerId, modelId]
                      properties:
                        providerId: { type: string, format: uuid }
                        modelId: { type: string, minLength: 1 }
      responses:
        '202':
          description: Generation job queued.
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    items: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Conflict' }
  /projects/{projectId}/outputs/{outputId}/edit-sessions:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/OutputId'
    post:
      operationId: createEditSession
      responses:
        '201':
          description: Edit session created or reused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditSession' }
  /edit-sessions/{sessionId}:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEditSession
      responses:
        '200':
          description: Edit session and turns.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/EditSession'
                  - type: object
                    required: [turns]
                    properties:
                      turns: { type: array, items: { $ref: '#/components/schemas/EditTurn' } }
                      versions: { type: array, items: { $ref: '#/components/schemas/Output' } }
  /edit-sessions/{sessionId}/memory:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateEditSessionMemory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary, constraints]
              properties:
                summary: { type: string, maxLength: 4000 }
                constraints: { type: array, items: { type: string, maxLength: 500 }, maxItems: 30 }
      responses:
        '200':
          description: Updated edit session memory.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditSession' }
        '404': { $ref: '#/components/responses/NotFound' }
  /edit-sessions/{sessionId}/turns:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createEditTurn
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [message]
              properties:
                baseOutputId: { type: string, format: uuid }
                message: { type: string, maxLength: 4000 }
                annotations: { type: string, description: JSON encoded annotation document. }
                editMask: { type: string, format: binary }
                protectMask: { type: string, format: binary }
                referenceAssetIds: { type: string, description: JSON encoded asset ID array. }
      responses:
        '202':
          description: Edit plan queued.
          content:
            application/json:
              schema:
                type: object
                required: [turnId, planJobId, status]
                properties:
                  turnId: { type: string, format: uuid }
                  planJobId: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/EditTurnStatus' }
  /edit-sessions/{sessionId}/select-output:
    parameters:
      - name: sessionId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: selectEditSessionOutput
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outputId]
              properties:
                outputId: { type: string, format: uuid }
      responses:
        '200':
          description: Current edit output changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditSession' }
  /edit-turns/{turnId}:
    parameters:
      - name: turnId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEditTurn
      responses:
        '200':
          description: Edit turn state and plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EditTurn' }
  /edit-turns/{turnId}/approve:
    parameters:
      - name: turnId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveEditTurn
      responses:
        '202':
          description: Edit generation queued.
          content:
            application/json:
              schema:
                type: object
                required: [job, turn]
                properties:
                  job: { $ref: '#/components/schemas/Job' }
                  turn: { $ref: '#/components/schemas/EditTurn' }
  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      responses:
        '200':
          description: Job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{jobId}/cancel:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: cancelJob
      responses:
        '202':
          description: Cancellation requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /jobs/{jobId}/retry:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      operationId: retryJob
      responses:
        '202':
          description: New retry job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
  /projects/{projectId}/export-jobs:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createExportJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExportJobInput'
      responses:
        '202':
          description: Export job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportJobBundle'
  /exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: getExport
      responses:
        '200':
          description: Export package state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export'
  /files/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: downloadAsset
      responses:
        '200': { description: Original asset bytes. }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/outputs/{outputId}:
    parameters:
      - $ref: '#/components/parameters/OutputId'
    get:
      operationId: downloadOutput
      responses:
        '200': { description: Generated image bytes. }
        '404': { $ref: '#/components/responses/NotFound' }
  /files/exports/{exportId}:
    parameters:
      - $ref: '#/components/parameters/ExportId'
    get:
      operationId: downloadExport
      responses:
        '200': { description: ZIP package bytes. }
        '404': { $ref: '#/components/responses/NotFound' }
  /events:
    get:
      operationId: subscribeEvents
      parameters:
        - name: projectId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Server-sent event stream.
          content:
            text/event-stream:
              schema:
                type: string
components:
  parameters:
    ProviderId: { name: providerId, in: path, required: true, schema: { type: string, format: uuid } }
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, format: uuid } }
    AssetId: { name: assetId, in: path, required: true, schema: { type: string, format: uuid } }
    StoryboardItemId: { name: itemId, in: path, required: true, schema: { type: string, format: uuid } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, format: uuid } }
    OutputId: { name: outputId, in: path, required: true, schema: { type: string, format: uuid } }
    ExportId: { name: exportId, in: path, required: true, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, required: false, schema: { type: string } }
  responses:
    ValidationError:
      description: Request does not match the schema.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    NotFound:
      description: Resource not found.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Conflict:
      description: Current resource state rejects this operation.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    CapabilityUnsupported:
      description: The selected model lacks a requested capability.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ProviderError:
      description: Provider connectivity or protocol failure.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
  schemas:
    Health: { type: object, required: [status, webResearchAvailable], properties: { status: { type: string, const: ok }, webResearchAvailable: { type: boolean, description: Whether the server has a configured restricted visual-research search key. } } }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
            requestId: { type: string, format: uuid }
    ProviderConfig:
      type: object
      required: [id, name, baseUrl, reasoningProtocol, models, hasApiKey, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        baseUrl: { type: string, format: uri }
        reasoningProtocol: { type: string, enum: [openai, dashscope_qwen] }
        hasApiKey: { type: boolean }
        models: { type: array, items: { $ref: '#/components/schemas/ModelCapability' } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ModelCapability:
      type: object
      required: [id, supportsVision, supportsThinking, supportsTools, supportsStructuredOutput]
      properties:
        id: { type: string }
        supportsVision: { type: boolean }
        supportsThinking: { type: boolean }
        supportsTools: { type: boolean }
        supportsStructuredOutput: { type: boolean }
        imageApiKind: { type: [string, 'null'], enum: [openai_images, custom, null] }
    CreateProviderInput:
      type: object
      required: [name, baseUrl, reasoningProtocol, apiKey, models]
      properties:
        name: { type: string, minLength: 1 }
        baseUrl: { type: string, format: uri }
        reasoningProtocol: { type: string, enum: [openai, dashscope_qwen] }
        apiKey: { type: string, minLength: 1, writeOnly: true }
        models: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ModelCapability' } }
    UpdateProviderInput:
      allOf:
        - $ref: '#/components/schemas/CreateProviderInput'
    ProviderList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProviderConfig' } }
        nextCursor: { type: [string, 'null'] }
    SearchSourceKind: { type: string, enum: [brave, tavily, searxng] }
    SearchSourceConfig:
      type: object
      required: [id, name, kind, baseUrl, priority, enabled, hasApiKey, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { $ref: '#/components/schemas/SearchSourceKind' }
        baseUrl: { type: string, format: uri }
        priority: { type: integer, minimum: 0, maximum: 100000, description: Lower values are searched first. }
        enabled: { type: boolean }
        hasApiKey: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateSearchSourceInput:
      type: object
      required: [name, kind, priority]
      properties:
        name: { type: string, minLength: 1 }
        kind: { $ref: '#/components/schemas/SearchSourceKind' }
        baseUrl: { type: string, format: uri }
        apiKey: { type: string, minLength: 1, writeOnly: true }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        enabled: { type: boolean, default: true }
    UpdateSearchSourceInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        kind: { $ref: '#/components/schemas/SearchSourceKind' }
        baseUrl: { type: string, format: uri }
        apiKey: { type: string, minLength: 1, writeOnly: true }
        priority: { type: integer, minimum: 0, maximum: 100000 }
        enabled: { type: boolean }
    SearchSourceList:
      type: object
      required: [items, nextCursor]
      properties:
